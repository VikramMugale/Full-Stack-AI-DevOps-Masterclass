name: Demo CI Env Secrets

on:
  # push
    workflow_dispatch:

env: 
      GLOBAL_APP_ENV: global-dev

jobs:
  build:
    runs-on: ubuntu-latest
    env: 
        JOB_APP_ENV: Job-dev
    steps:
      - name: Say Hello
        run: echo Hello from the second workflow!

      - name: Install
        env: 
            APP_ENV: dev
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment $APP_ENV using ${DB_PASSWORD} , ${GLOBAL_APP_ENV} and ${JOB_APP_ENV}" 
      
      - name: Create Demo File
        run: |
          echo "This is a demo file created by the workflow." > demo.txt
          echo "Demo file created successfully."

      - name: Upload Demo
        uses: actions/upload-artifact@v4
        with: 
          name: build-artifact-demo
          path: . 
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test Job
        run: echo "Running tests on the build artifact..."