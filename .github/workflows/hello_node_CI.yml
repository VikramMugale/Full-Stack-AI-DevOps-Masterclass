name: Node.js App to Docker

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'docker/app1-hello/node'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'

      - name: Install Dependencies
        working-directory: docker/app1-hello/node
        run: npm install

      - name: Test Node.js Application (If Present)
        working-directory: docker/app1-hello/node
        run: npm test --if-present

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: docker/app1-hello/node
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-node:latest
            ${{ secrets.DOCKER_USERNAME }}/hello-node:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/hello-node:${{ github.ref_name }}